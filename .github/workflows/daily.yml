name: Consulta diaria Carrefour

on:
  schedule:
    # 10:07 en Argentina (UTC-3). GitHub puede retrasar algunos minutos.
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-daily
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Productoscarre/package.json

      - name: Instalar dependencias
        working-directory: Productoscarre
        run: npm install --omit=dev

      - name: Consultar precios y enviar Telegram
        working-directory: Productoscarre
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIG_PATH: config.json
          HISTORY_PATH: history.json
        run: node monitor.mjs

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Productoscarre/history.json
          git diff --cached --quiet || git commit -m "Actualizar historial de precios"
          git push

